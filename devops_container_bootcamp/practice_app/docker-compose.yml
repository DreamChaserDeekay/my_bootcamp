services:
  app:
    build: .
    image: devops-lab:dev
    ports:
      - "8080:8080"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70"
      SPRING_PROFILES_ACTIVE: docker
      GREETING: "Hello from docker-compose"
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_pwd
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      timeout: 3s
      retries: 5

  adminer:
    image: adminer
    ports:
      - "8081:8080"
    networks: [backend]
    profiles: [debug]

networks:
  backend:

volumes:
  db-data:
