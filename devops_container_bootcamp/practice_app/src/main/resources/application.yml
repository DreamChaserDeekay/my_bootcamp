spring:
  application:
    name: devops-lab

server:
  port: 8080
  shutdown: graceful
  tomcat:
    threads:
      max: 50

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    root: INFO
    com.example: ${LOG_LEVEL_APP:INFO}
